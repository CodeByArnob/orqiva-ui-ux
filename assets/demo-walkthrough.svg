<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#060810; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060810" />
      <stop offset="50%" stop-color="#0B0F1E" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <path d="M 0 68 L 1200 68 M 0 136 L 1200 136 M 0 204 L 1200 204 M 0 272 L 1200 272 M 0 340 L 1200 340 M 0 408 L 1200 408 M 0 476 L 1200 476 M 0 544 L 1200 544 M 0 612 L 1200 612" />
    <path d="M 120 0 L 120 680 M 240 0 L 240 680 M 360 0 L 360 680 M 480 0 L 480 680 M 600 0 L 600 680 M 720 0 L 720 680 M 840 0 L 840 680 M 960 0 L 960 680 M 1080 0 L 1080 680" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <text x="90" y="17" fill="#38BDF8" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle" letter-spacing="1">SENIOR DEVELOPER WORKFLOW</text>
    
    <text x="0" y="60" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">How to Use ORQIVA UI/UX Skill &amp; CLI</text>
    <text x="0" y="86" fill="#94A3B8" font-size="14" font-weight="400">Step-by-step interactive workflow from project initialization to production code verification.</text>
  </g>

  <!-- Step 1 Card: CLI Initializer -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="250" height="460" rx="18" fill="#0C1024" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Step Badge -->
    <rect x="20" y="22" width="65" height="22" rx="11" fill="url(#cyanGrad)" />
    <text x="52" y="37" fill="#0B0F19" font-size="11" font-weight="800" text-anchor="middle">STEP 1</text>
    <text x="96" y="38" fill="#38BDF8" font-size="12" font-weight="700">Project Init</text>

    <text x="20" y="74" fill="#FFFFFF" font-size="16" font-weight="700">Inject Tokens &amp; Preset</text>
    <text x="20" y="96" fill="#94A3B8" font-size="12" line-height="16">Run in your terminal to inspect stack and generate tokens.</text>

    <!-- Mini Terminal Screen -->
    <g transform="translate(18, 120)">
      <rect width="214" height="210" rx="10" fill="#050711" stroke="#1E293B" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#EF4444" opacity="0.8" />
      <circle cx="26" cy="14" r="4" fill="#F59E0B" opacity="0.8" />
      <circle cx="38" cy="14" r="4" fill="#10B981" opacity="0.8" />

      <text x="12" y="42" fill="#10B981" font-size="10" font-family="monospace" font-weight="700">$ npx orqiva-ui-ux init</text>
      <text x="12" y="64" fill="#64748B" font-size="9" font-family="monospace">Detecting stack...</text>
      <text x="12" y="80" fill="#38BDF8" font-size="9" font-family="monospace">✓ Found Next.js 15</text>
      <text x="12" y="96" fill="#38BDF8" font-size="9" font-family="monospace">✓ Found Tailwind CSS</text>
      
      <text x="12" y="120" fill="#F1F5F9" font-size="9" font-family="monospace">? Select Archetype:</text>
      <text x="12" y="136" fill="#A855F7" font-size="9" font-family="monospace">&gt; 1. Luxury Editorial</text>
      <text x="12" y="152" fill="#64748B" font-size="9" font-family="monospace">  2. Cosmic FinTech</text>
      <text x="12" y="168" fill="#64748B" font-size="9" font-family="monospace">  3. NovaBank Mobile</text>

      <text x="12" y="194" fill="#10B981" font-size="9" font-family="monospace">✓ tokens.css generated</text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(20, 350)">
      <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="600">✓ Auto Stack Detection</text>
      <text x="0" y="40" fill="#E2E8F0" font-size="12" font-weight="600">✓ Tailwind Config Preset</text>
      <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600">✓ TypeScript Token Export</text>
      <text x="0" y="84" fill="#E2E8F0" font-size="12" font-weight="600">✓ Zero Extra npm Modules</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <g transform="translate(320, 380)">
    <circle cx="15" cy="0" r="14" fill="#0C1024" stroke="#38BDF8" stroke-width="1.5" />
    <path d="M 12 -4 L 18 0 L 12 4" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 2 Card: Agent Pairing -->
  <g transform="translate(340, 160)" filter="url(#cardShadow)">
    <rect width="250" height="460" rx="18" fill="#0C1024" stroke="#1E293B" stroke-width="1.5" />

    <rect x="20" y="22" width="65" height="22" rx="11" fill="url(#purpleGrad)" />
    <text x="52" y="37" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">STEP 2</text>
    <text x="96" y="38" fill="#A855F7" font-size="12" font-weight="700">Agent Pairing</text>

    <text x="20" y="74" fill="#FFFFFF" font-size="16" font-weight="700">Prompt Claude or Cursor</text>
    <text x="20" y="96" fill="#94A3B8" font-size="12">Natural language UI prompt triggers the loaded ORQIVA skill.</text>

    <!-- Chat Prompt Window -->
    <g transform="translate(18, 120)">
      <rect width="214" height="210" rx="10" fill="#050711" stroke="#1E293B" stroke-width="1" />
      <rect x="12" y="12" width="190" height="76" rx="8" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
      <text x="20" y="28" fill="#A5B4FC" font-size="9" font-family="monospace">DEVELOPER PROMPT:</text>
      <text x="20" y="44" fill="#FFFFFF" font-size="10" font-weight="600">"Build a P2P money</text>
      <text x="20" y="58" fill="#FFFFFF" font-size="10" font-weight="600">transfer screen with</text>
      <text x="20" y="72" fill="#FFFFFF" font-size="10" font-weight="600">12-key tactile keypad."</text>

      <!-- Agent Response Box -->
      <rect x="12" y="98" width="190" height="98" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="20" y="114" fill="#38BDF8" font-size="9" font-family="monospace">ORQIVA ENGINE DETECTED:</text>
      <text x="20" y="130" fill="#34D399" font-size="9" font-family="monospace">Archetype: NovaBank</text>
      <text x="20" y="146" fill="#94A3B8" font-size="9" font-family="monospace">Target: 390px Mobile View</text>
      <text x="20" y="162" fill="#94A3B8" font-size="9" font-family="monospace">Contrast Rule: 4.5:1 AA</text>
      <text x="20" y="178" fill="#94A3B8" font-size="9" font-family="monospace">Touch Min: 56x56px Keypad</text>
    </g>

    <g transform="translate(20, 350)">
      <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="600">✓ Progressive Reference Load</text>
      <text x="0" y="40" fill="#E2E8F0" font-size="12" font-weight="600">✓ Contextual Taxonomy Map</text>
      <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600">✓ Works in Claude Code</text>
      <text x="0" y="84" fill="#E2E8F0" font-size="12" font-weight="600">✓ Works in Cursor &amp; Windsurf</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <g transform="translate(600, 380)">
    <circle cx="15" cy="0" r="14" fill="#0C1024" stroke="#A855F7" stroke-width="1.5" />
    <path d="M 12 -4 L 18 0 L 12 4" stroke="#A855F7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 Card: Multi-Language Code -->
  <g transform="translate(620, 160)" filter="url(#cardShadow)">
    <rect width="250" height="460" rx="18" fill="#0C1024" stroke="#1E293B" stroke-width="1.5" />

    <rect x="20" y="22" width="65" height="22" rx="11" fill="url(#goldGrad)" />
    <text x="52" y="37" fill="#0B0F19" font-size="11" font-weight="800" text-anchor="middle">STEP 3</text>
    <text x="96" y="38" fill="#FACC15" font-size="12" font-weight="700">Code Synthesis</text>

    <text x="20" y="74" fill="#FFFFFF" font-size="16" font-weight="700">Multi-Stack Generation</text>
    <text x="20" y="96" fill="#94A3B8" font-size="12">Generates genuine, accessible components for your target stack.</text>

    <!-- Code Block Preview -->
    <g transform="translate(18, 120)">
      <rect width="214" height="210" rx="10" fill="#050711" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="24" fill="#64748B" font-size="9" font-family="monospace">// React / TSX + Tailwind</text>
      <text x="12" y="42" fill="#38BDF8" font-size="9" font-family="monospace">&lt;button</text>
      <text x="20" y="56" fill="#E2E8F0" font-size="9" font-family="monospace">aria-label="Send $250"</text>
      <text x="20" y="70" fill="#E2E8F0" font-size="9" font-family="monospace">className="min-h-[56px]</text>
      <text x="20" y="84" fill="#E2E8F0" font-size="9" font-family="monospace">w-full bg-[#FF3B56]</text>
      <text x="20" y="98" fill="#E2E8F0" font-size="9" font-family="monospace">rounded-2xl text-white</text>
      <text x="20" y="112" fill="#E2E8F0" font-size="9" font-family="monospace">focus-visible:ring-2"&gt;</text>
      <text x="20" y="128" fill="#FCD34D" font-size="9" font-family="monospace">Send Money</text>
      <text x="12" y="144" fill="#38BDF8" font-size="9" font-family="monospace">&lt;/button&gt;</text>
      
      <line x1="12" y1="156" x2="202" y2="156" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="172" fill="#64748B" font-size="8" font-family="monospace">Also exports to:</text>
      <text x="12" y="188" fill="#10B981" font-size="9" font-family="monospace">Flutter • Jetpack • SwiftUI</text>
    </g>

    <g transform="translate(20, 350)">
      <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="600">✓ React / Next.js / Vue</text>
      <text x="0" y="40" fill="#E2E8F0" font-size="12" font-weight="600">✓ Flutter Theme Extensions</text>
      <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600">✓ Android Jetpack Compose</text>
      <text x="0" y="84" fill="#E2E8F0" font-size="12" font-weight="600">✓ iOS SwiftUI Tokens</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <g transform="translate(880, 380)">
    <circle cx="15" cy="0" r="14" fill="#0C1024" stroke="#10B981" stroke-width="1.5" />
    <path d="M 12 -4 L 18 0 L 12 4" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 4 Card: MCP & A11y Audit -->
  <g transform="translate(900, 160)" filter="url(#cardShadow)">
    <rect width="250" height="460" rx="18" fill="#0C1024" stroke="#1E293B" stroke-width="1.5" />

    <rect x="20" y="22" width="65" height="22" rx="11" fill="url(#emeraldGrad)" />
    <text x="52" y="37" fill="#0B0F19" font-size="11" font-weight="800" text-anchor="middle">STEP 4</text>
    <text x="96" y="38" fill="#10B981" font-size="12" font-weight="700">Audit &amp; MCP</text>

    <text x="20" y="74" fill="#FFFFFF" font-size="16" font-weight="700">Verify &amp; Ship</text>
    <text x="20" y="96" fill="#94A3B8" font-size="12">Automatic verification with zero accessibility violations.</text>

    <!-- Verification Audit Screen -->
    <g transform="translate(18, 120)">
      <rect width="214" height="210" rx="10" fill="#050711" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="24" fill="#10B981" font-size="9" font-family="monospace" font-weight="700">$ npx orqiva-ui-ux audit</text>
      <text x="12" y="44" fill="#64748B" font-size="8" font-family="monospace">Running WCAG 2.2 AA suite...</text>

      <rect x="12" y="58" width="190" height="34" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
      <text x="22" y="73" fill="#34D399" font-size="9" font-weight="700">CONTRAST CHECK</text>
      <text x="22" y="85" fill="#A7F3D0" font-size="8">19.66:1 ratio (Required 4.5:1) ✓ PASS</text>

      <rect x="12" y="100" width="190" height="34" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
      <text x="22" y="115" fill="#34D399" font-size="9" font-weight="700">TOUCH TARGETS</text>
      <text x="22" y="127" fill="#A7F3D0" font-size="8">56x56px keypad (Min 44px) ✓ PASS</text>

      <rect x="12" y="142" width="190" height="54" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
      <text x="22" y="157" fill="#34D399" font-size="9" font-weight="700">MCP SERVER READY</text>
      <text x="22" y="170" fill="#A7F3D0" font-size="8">orqiva-mcp connected</text>
      <text x="22" y="183" fill="#A7F3D0" font-size="8">0 errors • 0 warnings</text>
    </g>

    <g transform="translate(20, 350)">
      <text x="0" y="18" fill="#E2E8F0" font-size="12" font-weight="600">✓ WCAG 2.2 AA Guaranteed</text>
      <text x="0" y="40" fill="#E2E8F0" font-size="12" font-weight="600">✓ 44x44px Touch Enforcement</text>
      <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600">✓ MCP JSON-RPC Server</text>
      <text x="0" y="84" fill="#E2E8F0" font-size="12" font-weight="600">✓ Production Ready Release</text>
    </g>
  </g>
</svg>
