<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#glow)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Abstract Radar Pulse Rings -->
  <circle cx="600" cy="180" r="160" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="600" cy="180" r="110" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.25" />
  <circle cx="600" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Glowing Telemetry Waveform -->
  <path d="M 50,260 Q 200,210 350,270 T 650,220 T 950,280 T 1150,240" fill="none" stroke="url(#waveGrad)" stroke-width="3" />

  <!-- Logo Mark Icon -->
  <g transform="translate(600, 90)">
    <rect x="-30" y="-30" width="60" height="60" rx="16" fill="#09090b" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="11" font-family="'Inter', -apple-system, sans-serif" font-size="32" font-weight="900" fill="#38bdf8" text-anchor="middle">O</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="185" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="url(#textGrad)" text-anchor="middle">
    ORQIVA UI/UX
  </text>

  <!-- Subtitle -->
  <text x="600" y="225" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.5" text-anchor="middle">
    Adaptive Design Intelligence for AI Coding Agents
  </text>

  <!-- Feature Badges -->
  <g transform="translate(600, 290)">
    <!-- Badge 1: WCAG 2.2 AA -->
    <g transform="translate(-250, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#111827" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
      <circle cx="-60" cy="0" r="4" fill="#10b981" />
      <text x="-48" y="5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399">WCAG 2.2 AA PASS</text>
    </g>

    <!-- Badge 2: Multi-Framework -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="-70" cy="0" r="4" fill="#38bdf8" />
      <text x="-58" y="5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#7dd3fc">MULTI-FRAMEWORK</text>
    </g>

    <!-- Badge 3: Zero Placeholders -->
    <g transform="translate(250, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#111827" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <circle cx="-60" cy="0" r="4" fill="#a855f7" />
      <text x="-48" y="5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#c084fc">REAL WORKING CODE</text>
    </g>
  </g>
</svg>
